version: 2
updates:
  # Weekly npm dependency updates so security and version drift surface as
  # reviewable pull requests instead of accumulating silently.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk dev tooling into one PR to cut review noise.
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # TypeScript 7 ships no JS compiler API, which typescript-eslint and the
      # Next.js build type check both require.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint 10 breaks eslint-plugin-react, which eslint-config-next bundles.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # Keep the GitHub Actions used by CI current too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
