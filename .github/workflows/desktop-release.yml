name: Desktop Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # A `v*` tag published three installers without running one test.
  # `test.yml` is a `push`/`pull_request` workflow, so it does not fire on a
  # tag ref at all — the release path had no gate whatsoever. Every build
  # job below waits on this one.
  #
  # The installers are NOT code-signed: the macOS build is unsigned and
  # un-notarized (electron-builder.yml) and the Windows build carries no
  # Authenticode signature. The release publishes a SHA256SUMS of the three
  # installers so a download can at least be checked against the release.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # electron-builder publishes to the release named after package.json's
      # version, while the notes job below looks the release up by the pushed
      # tag. A mismatch published installers to a different release and then
      # failed after the fact; refuse before anything is built.
      - name: Tag matches package.json version
        run: |
          set -euo pipefail
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "FAIL: tag $GITHUB_REF_NAME does not match package.json version ($expected)." >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package.json"

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:ci

      - name: Test
        run: npm test -- --run

      - name: Node-environment tests
        run: npm run test:node

  build-macos:
    needs: gate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://convex.altnautica.com

      - name: Compile Electron
        run: npm run electron:compile

      - name: Build macOS app
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: release/*.dmg

  build-windows:
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://convex.altnautica.com

      - name: Compile Electron
        run: npm run electron:compile

      - name: Build Windows app
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: release/*.exe

  build-linux:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://convex.altnautica.com

      - name: Compile Electron
        run: npm run electron:compile

      - name: Build Linux app
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: release/*.AppImage

  update-release-notes:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect the installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: "*-build"
          merge-multiple: true

      - name: Build SHA256SUMS
        run: |
          set -euo pipefail
          cd installers
          shopt -s nullglob
          files=(*.dmg *.exe *.AppImage)
          # Two macOS images (x64, arm64), one Windows installer, one AppImage.
          if [ "${#files[@]}" -lt 4 ]; then
            echo "FAIL: expected at least 4 installers, found ${#files[@]}: ${files[*]}" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Update release notes from CHANGELOG
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            // Match `## [version]` line then capture everything until the next
            // `## [` heading (or end of file). Escape dots in the version.
            const escaped = version.replace(/\./g, '\\.');
            const re = new RegExp(`^## \\[${escaped}\\][^\\n]*\\n([\\s\\S]*?)(?=^## \\[|$(?![\\s\\S]))`, 'm');
            const match = changelog.match(re);
            if (!match) {
              core.setFailed(`No CHANGELOG section found for ${version}.`);
              return;
            }
            const body = [
              `## Altnautica Command ${tag}`,
              '',
              match[1].trim(),
              '',
              '---',
              '',
              '### Downloads',
              '',
              '- **macOS:** `.dmg` (Intel and Apple Silicon), unsigned and not notarized',
              '- **Windows:** `.exe` installer, unsigned',
              '- **Linux:** `.AppImage`',
              '',
              'These installers are not code-signed. Check a download against',
              '`SHA256SUMS` in this release (`sha256sum -c SHA256SUMS --ignore-missing`).',
              '',
              '> For the latest web version, visit [command.altnautica.com](https://command.altnautica.com).',
            ].join('\n');
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const release = releases.find(r => r.tag_name === tag);
            if (!release) {
              core.setFailed(`Release for tag ${tag} not found`);
              return;
            }
            // Replace a SHA256SUMS left by an earlier attempt of this run.
            for (const asset of release.assets) {
              if (asset.name === 'SHA256SUMS') {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                });
              }
            }
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name: 'SHA256SUMS',
              data: fs.readFileSync('installers/SHA256SUMS'),
            });
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              draft: false,
              body,
            });
