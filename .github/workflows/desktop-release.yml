name: Desktop Release

on:
  push:
    tags:
      - "v*"
  # The Release workflow (release.yml) calls this one directly: its tag push
  # uses GITHUB_TOKEN, which does not start the tag trigger above.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # A `v*` tag published three installers without running one test.
  # `test.yml` is a `push`/`pull_request` workflow, so it does not fire on a
  # tag ref at all — the release path had no gate whatsoever. Every build
  # job below waits on this one.
  #
  # The installers are NOT code-signed: the macOS build is unsigned and
  # un-notarized (electron-builder.yml) and the Windows build carries no
  # Authenticode signature. The release publishes a SHA256SUMS of the three
  # installers so a download can at least be checked against the release.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      # electron-builder publishes to the release named after package.json's
      # version, while the notes job below looks the release up by the pushed
      # tag. A mismatch published installers to a different release and then
      # failed after the fact; refuse before anything is built.
      - name: Tag matches package.json version
        run: |
          set -euo pipefail
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$expected" != "$TAG" ]; then
            echo "FAIL: tag $TAG does not match package.json version ($expected)." >&2
            exit 1
          fi
          echo "tag $TAG matches package.json"

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:ci

      - name: Test
        run: npm test -- --run

      - name: Node-environment tests
        run: npm run test:node

      # The three build jobs run in parallel and each electron-builder looks
      # for a release named after the tag, creating one when none exists. With
      # no release yet, two jobs can each create a draft and split the
      # installers between them. Create the one draft here, before any build.
      - name: Create the draft release the builds upload to
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\")][0].id // empty")
          if [ -n "$existing" ]; then
            echo "release $existing already exists for $TAG"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "${TAG#v}" --notes ""
          fi

  build-macos:
    needs: gate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://convex.altnautica.com
          # The macOS arm64 runner has 7 GB; Node's default heap there (about 2 GB) runs out in the type check.
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Compile Electron
        run: npm run electron:compile

      - name: Build macOS app
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: release/*.dmg

  build-windows:
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://convex.altnautica.com
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Compile Electron
        run: npm run electron:compile

      - name: Build Windows app
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: release/*.exe

  build-linux:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://convex.altnautica.com
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Compile Electron
        run: npm run electron:compile

      - name: Build Linux app
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: release/*.AppImage

  update-release-notes:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Collect the installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: "*-build"
          merge-multiple: true

      - name: Build SHA256SUMS
        run: |
          set -euo pipefail
          cd installers
          shopt -s nullglob
          files=(*.dmg *.exe *.AppImage)
          # Two macOS images (x64, arm64), one Windows installer, one AppImage.
          if [ "${#files[@]}" -lt 4 ]; then
            echo "FAIL: expected at least 4 installers, found ${#files[@]}: ${files[*]}" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Update release notes from CHANGELOG
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const notes = require(`${process.env.GITHUB_WORKSPACE}/scripts/release-notes.cjs`);
            const { execFileSync } = require('child_process');
            const tag = process.env.TAG;
            const section = notes.extractSection(fs.readFileSync('CHANGELOG.md', 'utf8'), tag.replace(/^v/, ''));
            if (section === null) {
              core.setFailed(`No CHANGELOG section found for ${tag}.`);
              return;
            }
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
            let prev = null;
            try {
              prev = git('describe', '--tags', '--abbrev=0', '--match', 'v[0-9]*.[0-9]*.[0-9]*', `${tag}^`);
            } catch {
              prev = null;
            }
            const commits = prev
              ? git('log', '--no-merges', '--reverse', '--format=%H%x1f%s', `${prev}..${tag}`)
                  .split('\n')
                  .filter(Boolean)
                  .map((line) => {
                    const [sha, subject] = line.split('\x1f');
                    return { sha, subject };
                  })
              : [];
            const body = notes.releaseBody({
              tag,
              section,
              commitList: notes.commitListMarkdown({
                commits,
                prevTag: prev,
                tag,
                repoUrl: `https://github.com/${context.repo.owner}/${context.repo.repo}`,
              }),
            });
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const matching = releases.filter(r => r.tag_name === tag);
            if (matching.length !== 1) {
              core.setFailed(`Expected one release for tag ${tag}, found ${matching.length}: ${matching.map(r => r.id).join(', ')}`);
              return;
            }
            const release = matching[0];
            // Every installer this run built must be on the release it publishes.
            const names = new Set(release.assets.map(a => a.name));
            const missing = fs.readdirSync('installers').filter(f => f !== 'SHA256SUMS' && !names.has(f));
            if (missing.length > 0) {
              core.setFailed(`Release ${release.id} for ${tag} is missing: ${missing.join(', ')}`);
              return;
            }
            // Replace a SHA256SUMS left by an earlier attempt of this run.
            for (const asset of release.assets) {
              if (asset.name === 'SHA256SUMS') {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                });
              }
            }
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name: 'SHA256SUMS',
              data: fs.readFileSync('installers/SHA256SUMS'),
            });
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              draft: false,
              body,
            });
