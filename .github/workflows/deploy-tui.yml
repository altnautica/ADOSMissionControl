name: deploy-tui

# Gate + release the Rust stack deployer (tools/deploy). Cross-platform, since
# the deployer runs on operator laptops (macOS / Windows / Linux).

on:
  push:
    paths: ["tools/deploy/**", ".github/workflows/deploy-tui.yml"]
    tags: ["ados-deploy-v*"]
  pull_request:
    paths: ["tools/deploy/**", ".github/workflows/deploy-tui.yml"]

# Read-only by default; only the publish job writes the release.
permissions:
  contents: read

defaults:
  run:
    working-directory: tools/deploy

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: gallery renders
        run: cargo run --quiet --example ui_gallery

  build:
    name: build (${{ matrix.target }})
    needs: gate
    if: startsWith(github.ref, 'refs/tags/ados-deploy-v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        run: cargo build --release --target ${{ matrix.target }}
      - name: stage
        shell: bash
        run: |
          bin="ados-deploy"
          [[ "${{ matrix.os }}" == "windows-latest" ]] && bin="ados-deploy.exe"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/$bin" "dist/ados-deploy-${{ matrix.target }}${bin##ados-deploy}"
      - uses: actions/upload-artifact@v7
        with:
          name: ados-deploy-${{ matrix.target }}
          path: tools/deploy/dist/*
          if-no-files-found: error
          retention-days: 1

  # The deployer runs on an operator laptop and carries the stack's
  # credentials, so every binary ships with a .sha256 and a minisign signature
  # from the release key, plus a signed SHA256SUMS. A run without the signing
  # secret fails instead of publishing binaries nobody can check.
  release:
    name: sign + publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_KEY: ${{ secrets.ADOS_DRIVER_SIGNING_KEY }}
      # Public half of the release key; each signature is checked against it
      # before anything is published.
      RELEASE_PUBKEY: RWQ/CJ1+gk7rjVfGSoy6MOL50e8TmO30KD/J+goaEj+WMI1uzEf92rHN
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: tools/deploy/dist
          pattern: ados-deploy-*
          merge-multiple: true
      - name: checksums + signatures
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY}" ]; then
            echo "ADOS_DRIVER_SIGNING_KEY is not set; refusing to publish unsigned deployer binaries." >&2
            exit 1
          fi
          sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y minisign
          cd dist
          shopt -s nullglob
          bins=(ados-deploy-*)
          if [ "${#bins[@]}" -ne 4 ]; then
            echo "FAIL: expected 4 deployer binaries, found ${#bins[@]}: ${bins[*]}" >&2
            exit 1
          fi
          rm -f SHA256SUMS
          for f in "${bins[@]}"; do
            sha256sum "$f" > "$f.sha256"
            sha256sum "$f" >> SHA256SUMS
          done
          key="$(mktemp)"
          printf '%s' "${SIGNING_KEY}" > "$key"
          for f in "${bins[@]}" SHA256SUMS; do
            minisign -S -s "$key" -m "$f" -x "$f.minisig"
          done
          shred -u "$key"
          for f in "${bins[@]}" SHA256SUMS; do
            minisign -V -q -P "${RELEASE_PUBKEY}" -m "$f" -x "$f.minisig"
          done
          ls -l
      - uses: softprops/action-gh-release@v3
        with:
          files: tools/deploy/dist/*
