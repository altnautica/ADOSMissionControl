# Mosquitto ACL for the ADOS cloud relay.
#
# Loaded by mosquitto.conf only when the Production block is active (see
# `README.md` in this directory for the deployment runbook). Mosquitto's
# ACL semantics are "deny by default": any topic not explicitly granted
# below is denied.
#
# Topology:
#   Agent publishes/subscribes under `ados/<device_id>/...` with
#     username = "ados-<device_id>" and password = its Convex apiKey.
#   Bridge subscribes to the wildcard tree to forward into Convex
#     (tools/mqtt-bridge/src/index.ts; MQTT_USERNAME env var).
#
# Principals:
#   1. Per-device agent (username `ados-<device_id>`): readwrite on its own
#      device subtree only. A mosquitto `pattern` cannot strip the `ados-`
#      prefix from `%u`, so these entries are per device and are generated
#      from Convex by `scripts/regenerate-passwd.sh`:
#        user ados-<device_id>
#        topic readwrite ados/<device_id>/#
#   2. Bridge service account (username `ados`): read-only across all
#      `ados/+/...` topics so it can forward agent traffic to Convex.
#      The bridge does not need to publish on the agent-facing tree;
#      downstream command flow uses Convex HTTP, not MQTT publishes
#      from the bridge.
#   3. Per-operator control grants (`gcs-op-<random>`), also generated by
#      `scripts/regenerate-passwd.sh` from Convex `cmdMqttControlGrants`:
#        user gcs-op-<random>
#        topic read  ados/<device_id>/#
#        topic write ados/<device_id>/mavlink/rx
#        topic write ados/<device_id>/msp/rx
#        topic write ados/<device_id>/webrtc/offer
#      for each device the operator owned when the grant was minted.
#      Deliberately three write topics and not the `ados/<device_id>/#`
#      subtree: a subtree grant would also permit `/tx`, `/status` and
#      `/webrtc/answer` — the topics the AGENT publishes — so a browser could
#      fabricate telemetry and state for an aircraft and the fleet would
#      believe it. A new browser-published topic has to be added explicitly.
#      A refused publish is discarded silently at QoS 0, so absence of an
#      error is not evidence a publish landed; confirm by subscribing.
#   4. Reserved system topics (`$SYS/#`): admin only. The default deny
#      handles this, so no agent or bridge user can subscribe to it.

# Bridge service account: read everything under `ados/`. Username is set in
# the bridge container's MQTT_USERNAME env var; it must match the entry in
# /mosquitto/config/passwd created via `mosquitto_passwd`.
user ados
topic read ados/#

# Sysadmin / monitoring (optional). Uncomment and create the user via
# mosquitto_passwd before relying on this. The `$SYS/#` tree is mosquitto's
# internal broker stats; without this block it remains inaccessible.
# user ados-admin
# topic readwrite #
# topic read $SYS/#
