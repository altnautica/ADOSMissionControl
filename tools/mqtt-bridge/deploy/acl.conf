# Mosquitto ACL for the ADOS cloud relay.
#
# Loaded by mosquitto.conf only when the Production block is active (see
# `README.md` in this directory for the deployment runbook). Mosquitto's
# ACL semantics are "deny by default": any topic not explicitly granted
# below is denied.
#
# Topology:
#   Agent publishes/subscribes under `ados/<device_id>/...` with
#     username = "<device_id>" (no prefix), set by the agent's MQTT client
#     (ADOSDroneAgent/src/ados/services/mqtt/gateway.py around line 75).
#   Bridge subscribes to the wildcard tree to forward into Convex
#     (tools/mqtt-bridge/src/index.ts; MQTT_USERNAME env var).
#
# Three principals:
#   1. Per-device agent (username == device_id): readwrite on its own
#      device subtree only. Pattern substitution uses `%u` for the
#      connected username, so `pattern readwrite ados/%u/#` matches
#      exactly one subtree per agent. An agent with username `droneA`
#      cannot reach `ados/droneB/#`. By construction the agent's
#      device_id and its MQTT username are the same string.
#   2. Bridge service account (username `ados`): read-only across all
#      `ados/+/...` topics so it can forward agent traffic to Convex.
#      The bridge does not need to publish on the agent-facing tree;
#      downstream command flow uses Convex HTTP, not MQTT publishes
#      from the bridge.
#   3. Reserved system topics (`$SYS/#`): admin only. The default deny
#      handles this — no `pattern` line below references `$SYS`, so no
#      agent or bridge user can subscribe to it.
#
# Pattern substitution variables (mosquitto ACL):
#   %u  connected username
#   %c  connected client_id

# Agents: readwrite on their own subtree, identified by username == device_id.
pattern readwrite ados/%u/#

# Bridge service account: read everything under `ados/`. Username is set in
# the bridge container's MQTT_USERNAME env var; it must match the entry in
# /mosquitto/config/passwd created via `mosquitto_passwd`.
user ados
topic read ados/#

# 4. Per-operator control grants (`gcs-op-<random>`). NOT YET GENERATED — this
#    block documents the target policy; see the note at the end.
#
#    A browser session reaches the fleet with a shared, read-only credential, so
#    it can watch a drone and cannot command it: flight frames and video
#    signaling offers are publishes, and the broker discards them. The fix is
#    NOT to grant the shared viewer write access — one credential published to
#    every browser would let any viewer command any drone in any fleet.
#
#    Instead each operator gets their own short-lived principal, granted write
#    on exactly three topics per device they own:
#
#      user gcs-op-<random>
#      topic read  ados/#
#      topic write ados/<device_id>/mavlink/rx
#      topic write ados/<device_id>/msp/rx
#      topic write ados/<device_id>/webrtc/offer
#
#    Deliberately three topics and not the `ados/<device_id>/#` subtree. A
#    subtree grant would also permit `/tx`, `/status` and `/webrtc/answer` —
#    the topics the AGENT publishes — so a browser could fabricate telemetry
#    and state for an aircraft and the fleet would believe it. A browser needs
#    to send commands, never to report on the vehicle's behalf. A new
#    browser-published topic should have to be added here explicitly.
#
#    Verified against this broker: with the three lines above, publishes to
#    `/mavlink/rx`, `/msp/rx` and `/webrtc/offer` are delivered, while `/tx`,
#    `/status`, `/webrtc/answer` and another device's `/rx` are all dropped.
#    Note the denial is silent — a refused publish is discarded and the
#    publisher is told nothing at QoS 0, so absence of an error is not evidence
#    a publish landed. Confirm by subscribing and checking arrival.
#
#    Not yet wired: `regenerate-passwd.sh` does not emit these blocks, because
#    the Convex side that would supply the principals is not reachable from it
#    yet. Until that lands, no operator holds a write grant and the relay
#    remains receive-only for flight commands — which is what Mission Control
#    now reports rather than showing a healthy link that silently drops them.

# Sysadmin / monitoring (optional). Uncomment and create the user via
# mosquitto_passwd before relying on this. The `$SYS/#` tree is mosquitto's
# internal broker stats; without this block it remains inaccessible.
# user ados-admin
# topic readwrite #
# topic read $SYS/#
