services:
  video-relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - RTSP_URL_PATTERN=${RTSP_URL_PATTERN:-rtsp://host.docker.internal:8554/{deviceId}}
      - PORT=3001
      # Same value as the Convex deployment's VIDEO_RELAY_SECRET, which mints the viewer tokens.
      - VIDEO_RELAY_SECRET=${VIDEO_RELAY_SECRET:?set VIDEO_RELAY_SECRET (openssl rand -hex 32), and the same value on Convex}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - video-relay
